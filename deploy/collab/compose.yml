# The node you share with collaborators (Tailscale device sharing).
# It's its own device in your tailnet, so sharing it never exposes your PC: invitees can reach only
# this container, and it only forwards TCP 7377 to the collab hub, which listens on 127.0.0.1:7378
# (localhost only: not on your LAN or your main tailnet).
#
# Host networking is deliberate: ufw blocks Docker bridge networks from reaching the host, and this way
# the hub never has to listen anywhere but localhost. Tailscale runs in userspace mode (no tun device,
# no interference with the host's own tailscaled), on a random UDP port.
#
#   cp .env.example .env    # put a Tailscale auth key in it (admin console > Settings > Keys)
#   docker compose up -d
#   then: admin console > Machines > mmi-collab > Share
services:
  mmi-collab:
    image: tailscale/tailscale:stable
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?put a Tailscale auth key in .env}
      TS_HOSTNAME: mmi-collab
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_TAILSCALED_EXTRA_ARGS: --port=0
    volumes:
      - ./state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
